# Customer-service SDK profile overlay. DuckAI transports each message; the
# Harness model owns every customer-service decision and mounted data-tool call.

- id: system-prompt
  config:
    persona: >-
      你是由 {{model}} 驱动的通用企业微信客服 Agent，独立负责检索、工具选择、查询计划、证据判断、追问、回答和转人工。每轮只把当前 customer_message 作为待处理目标；历史和通道元数据仅提供上下文，除非客户明确延续，不得恢复历史中的未完成调查。不得按固定问法、关键词、页面、表、接口或答案编排分支。稳定产品知识优先使用产品资料；仅当结论依赖当前账号、范围或业务对象的实时私有事实时调用业务数据工具。实时结论必须由本轮成功观察明确绑定对象、属性、值、适用范围或时间；无筛选列表、无关记录、不完整观察、技术成功或历史结果都不能证明目标事实、唯一性或不存在。工具权限以本轮实际定义为准；API-MCP 调用能力只来自本轮成功搜索，历史工具名、引用和授权不能复用。失败调用不得原样重复；应改变取证、使用知识资料、只追问一个会改变处理路径的问题，或保留不确定性。对客户直接给出简洁结论和必要下一步，不复述内部调查。最终只输出一个 JSON 对象，不含 Markdown 或额外解释，并且必须且只能包含 action、replyText、reason；action 为 answer、ask 或 handoff，answer 和 ask 的 replyText 是直接发送的中文文本，handoff 的 replyText 可为空且 reason 写明原因。

- id: sandbox-policy
  config:
    mode: read-only
    workspaceRoot: !!js process.cwd()

- id: approval
  config:
    policy: ask

- id: skill-filesystem
  config:
    includeDefaultRoots: false
    customSkillDirs:
      - !!js process.env.DCS_SKILL_DIR

- id: llm-pi-ai
  config:
    providers:
      qwen-standard-cn:
        displayName: !!js process.env.DCS_MODEL_DISPLAY_NAME
        apiKeyEnv: DASHSCOPE_API_KEY
        api: openai-completions
        baseURL: !!js process.env.DCS_MODEL_BASE_URL
        # 阿里云兼容端点不接受 OpenAI 新增的 developer 角色，必须保留 system 角色。
        compat:
          supportsDeveloperRole: false
        models:
          - id: !!js process.env.DCS_MODEL_ID
            name: !!js process.env.DCS_MODEL_DISPLAY_NAME
            contextWindow: !!js Number(process.env.DCS_MODEL_CONTEXT_WINDOW)
            maxTokens: !!js Number(process.env.DCS_MODEL_MAX_OUTPUT_TOKENS)
            input: [text, image]
            reasoningEfforts:
              low: low
              medium: medium
              high: high
        timeoutMs: !!js Number(process.env.DCS_MODEL_TIMEOUT_MILLISECONDS)

- id: tool-bash
  disabled: true

- id: tool-pwsh
  disabled: true

- id: tool-jobs
  disabled: true

- id: tool-str-replace-editor
  disabled: true

- id: tool-subagent-control
  disabled: true

- id: tool-subagent-list-agents
  disabled: true

- id: tool-subagent
  disabled: true

- id: tool-subagent-fork
  disabled: true

- id: tool-workflow
  disabled: true

- id: tool-ralph
  disabled: true

- id: tool-todo
  disabled: true

- id: tool-goal
  disabled: true

- id: plan-mode
  disabled: true

- id: tool-web
  disabled: true

- id: session-telemetry-otel
  disabled: true

- insert:
    - id: customer-service-time-context
      name: '@deepseek-ai/dsh-time-context'
      config:
        timeZone: Asia/Shanghai
        refreshIntervalMs: 60000

    - id: customer-service-api-mcp
      name: '@deepseek-ai/dsh-mcp-client'
      disabled: !!js process.env.DCS_BUSINESS_DATA_MODE !== 'ApiMcp'
      config:
        serverName: lingke_api
        transport: streamable-http
        url: !!js process.env.DCS_MCP_URL
        headers:
          X-Kxm-Mcp-Key: !!js process.env.DCS_MCP_SERVICE_KEY
          X-Kxm-Caller-Id: !!js process.env.DCS_MCP_CALLER_ID
          X-Kxm-Conversation-Id: !!js process.env.DCS_MCP_CONVERSATION_ID
          X-Kxm-Product-Code: !!js process.env.DCS_MCP_PRODUCT_CODE
          X-Kxm-Perspective: !!js process.env.DCS_MCP_PERSPECTIVE
          X-Kxm-Secure-Context: !!js process.env.DCS_MCP_SECURE_CONTEXT
          X-Kxm-Allow-Minimum-Data: !!js process.env.DCS_MCP_ALLOW_MINIMUM_DATA
          X-Kxm-Customer-Subject-Grant: !!js process.env.DCS_MCP_CUSTOMER_SUBJECT_GRANT
          requestId: !!js process.env.DCS_MCP_REQUEST_ID
        toolCallTimeoutMs: !!js Number(process.env.DCS_MCP_TOOL_CALL_TIMEOUT_MILLISECONDS)
        failOnStartupError: !!js process.env.DCS_MCP_FAIL_ON_STARTUP_ERROR === 'true'
        capabilityBroker:
          searchToolName: search_capabilities
          invokeToolName: invoke_capability

    - id: customer-service-database
      name: '@deepseek-ai/dsh-customer-service-database'
      disabled: !!js process.env.DCS_BUSINESS_DATA_MODE !== 'Database'
      config:
        skillRoot: !!js process.env.DCS_SKILL_DIR
        productCode: !!js process.env.DCS_DATABASE_PRODUCT_CODE
        storeId: !!js Number(process.env.DCS_DATABASE_STORE_ID)
        operatorUid: !!js Number(process.env.DCS_DATABASE_OPERATOR_UID)
        merchantProfileVerified: !!js process.env.DCS_DATABASE_MERCHANT_VERIFIED === 'true'
        memberMobile: !!js process.env.DCS_DATABASE_MEMBER_MOBILE
        maxCatalogTables: !!js Number(process.env.DCS_DATABASE_MAX_CATALOG_TABLES)
