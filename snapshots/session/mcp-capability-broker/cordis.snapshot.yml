# Keyless twin of mcp-capability-broker.cordis.yml: replace only the external model.
- id: llm-deepseek
  name: '@deepseek-ai/dsh-llm-deepseek'
  disabled: true

- insert:
    - id: llm-replay
      name: '@deepseek-ai/dsh-llm-replay'
      config:
        providers:
          - id: deepseek-official
            name: DeepSeek
            models:
              - id: deepseek-v4-flash
              - id: deepseek-v4-pro
    - id: mcp-capability-broker
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        transport: stdio
        serverName: fixture
        command: !!js process.execPath
        args:
          - --import
          - !!js "decodeURIComponent(new URL('../../../node_modules/tsx/dist/esm/index.mjs', 'file://' + process.env.DSH_SNAPSHOT_FILE).pathname)"
          - !!js "decodeURIComponent(new URL('../../../packages/mcp/mcp-client/tests/fixture-server.ts', 'file://' + process.env.DSH_SNAPSHOT_FILE).pathname)"
        toolCallTimeoutMs: 15000
        failOnStartupError: true
        capabilityBroker:
          searchToolName: search_capabilities
          invokeToolName: invoke_capability
