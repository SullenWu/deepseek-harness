# Keyless twin of customer-service-database/cordis.yml: replace only the external model.
- id: llm-deepseek
  name: '@deepseek-ai/dsh-llm-deepseek'
  disabled: true

- insert:
    - id: llm-replay
      name: '@deepseek-ai/dsh-llm-replay'
      config:
        providers:
          - id: deepseek-official
            name: DeepSeek
            models:
              - id: deepseek-v4-flash
              - id: deepseek-v4-pro
    - id: customer-service-database
      name: '@deepseek-ai/dsh-customer-service-database'
      config:
        skillRoot: !!js "decodeURIComponent(new URL('./skills/', 'file://' + process.env.DSH_SNAPSHOT_FILE).pathname)"
        productCode: kxm_pc
        storeId: 12
        operatorUid: 34
        merchantProfileVerified: true
        maxCatalogTables: 8
